<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F0F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="皇家獲利">
<title>仙女皇家 一級獲利</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F0F9; --paper:#FFFCFD; --ink:#3D2946; --ink2:#7B6684; --ink3:#A897AE;
  --gold:#AE874A; --gold2:#E3CFA6; --gold3:#F4EAD6;
  --lav:#CBB5E0; --lav2:#EEE5F5; --lavd:#8A69AB; --rose:#D9A3BA; --neg:#B0506A;
  --line:rgba(174,135,74,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink); font-size:15px; line-height:1.6;
  background:var(--bg) radial-gradient(130% 55% at 50% -8%,#FFFFFF 0%,#F4EBF9 50%,rgba(246,240,249,0) 100%) no-repeat;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lavd);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:0 18px calc(100px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* ---------- welcome ---------- */
.welcome{max-width:440px;margin:0 auto;padding:36px 22px 40px;text-align:center}
.welcome .logo{width:min(250px,64vw);height:auto;display:block;margin:0 auto 18px;filter:drop-shadow(0 14px 30px rgba(138,105,171,.22))}
.tagline{font-size:15px;letter-spacing:.18em;color:var(--gold);margin:0 0 20px}
.opening{font-size:19px;line-height:1.95;margin:0 auto 30px;color:var(--ink);max-width:22em}
.opening span{display:block}
.w-form{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 20px 20px}
.privacy{font-size:13px;color:var(--ink2);margin:14px 0 0;text-align:center}
.credit{font-size:12px;color:var(--ink3);text-align:center;margin:26px 0 0;letter-spacing:.06em}

/* ---------- form atoms ---------- */
.field{margin-bottom:16px}
.field > label, .f-label{display:block;font-size:13px;color:var(--ink2);margin:0 0 6px;font-weight:500}
.input, select.input, textarea.input{
  width:100%; font-size:16px; padding:11px 13px; border-radius:12px;
  border:1px solid #E2D6E8; background:#fff; outline:none; appearance:none; -webkit-appearance:none;
}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.input:focus{border-color:var(--lavd);box-shadow:0 0 0 3px rgba(138,105,171,.14)}
.hint{font-size:12.5px;color:var(--ink3);margin-top:5px}
.level-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.level-pick button{
  padding:14px 8px;border-radius:14px;border:1px solid #E2D6E8;background:#fff;
  font-family:"Noto Serif TC",serif;font-size:18px;font-weight:700;color:var(--ink2)
}
.level-pick button[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF8,var(--gold3));color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold2)}
.btn{
  display:block;width:100%;border:0;border-radius:999px;padding:14px 18px;font-size:16px;font-weight:700;letter-spacing:.08em;
  color:#fff;background:linear-gradient(135deg,#9C7BBC 0%,#7E5E9F 100%);box-shadow:0 8px 20px rgba(126,94,159,.28)
}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:#fff;color:var(--lavd);border:1px solid var(--lav);box-shadow:none;font-weight:500}
.btn-gold{background:linear-gradient(135deg,#C9A468,#A7803F);box-shadow:0 8px 20px rgba(167,128,63,.25)}
.btn-danger{background:#fff;color:var(--neg);border:1px solid #E7BFCB;box-shadow:none;font-weight:500}
.btn-danger.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn-sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;letter-spacing:.02em}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
.top img{width:46px;height:46px}
.top .who{flex:1;min-width:0}
.top .hi{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--gold);letter-spacing:.1em}
.chip-level{font-family:"Noto Serif TC",serif;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;border:1px solid var(--gold2);background:linear-gradient(180deg,#FFFDF7,var(--gold3));color:var(--gold)}

.page-title{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:700;margin:14px 0 4px}
.page-desc{font-size:13.5px;color:var(--ink2);margin:0 0 16px}

/* ---------- month switch ---------- */
.mswitch{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 2px}
.mswitch button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);font-size:18px;color:var(--gold);line-height:1}
.mswitch .m{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700;min-width:120px;text-align:center}

/* ---------- hero ring (the jewel) ---------- */
.hero{text-align:center;padding:4px 0 8px}
.ring{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:6px auto 0}
.ring svg{width:100%;height:100%;display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px}
.ring-label{font-size:13px;color:var(--ink2);letter-spacing:.2em}
.ring-num{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(28px,8.6vw,38px);line-height:1.15;margin:4px 0 6px;word-break:break-all}
.ring-num.neg{color:var(--neg)}
.ring-pct{font-size:13px;color:var(--gold);font-weight:500}
.goal-line{font-size:14px;color:var(--ink2);margin:8px 0 0}
.goal-line b{color:var(--ink);font-weight:700}
.goal-line a{color:var(--lavd);font-weight:500}
@media (prefers-reduced-motion:no-preference){ .ring .prog{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1)} }

/* ---------- sections ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h3{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;margin:0}
.sec-h .aside{font-size:12.5px;color:var(--ink3)}

.src{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.src-row{padding:12px 0;border-bottom:1px dashed #EADFEF}
.src-row:last-child{border-bottom:0}
.src-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.src-name{font-size:14.5px}
.src-name small{display:block;font-size:12px;color:var(--ink3)}
.src-val{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;white-space:nowrap}
.bar{height:5px;border-radius:5px;background:var(--lav2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}

.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:14px 4px 14px 0}
.stat:nth-child(2n){padding-left:16px;border-left:1px solid var(--line)}
.stat:nth-child(n+3){border-top:1px solid var(--line)}
.stat .k{font-size:12.5px;color:var(--ink2)}
.stat .v{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px;line-height:1.3;word-break:break-all}

/* ---------- chart ---------- */
.chart-box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px}
.toggle{display:inline-flex;background:var(--lav2);border-radius:999px;padding:3px}
.toggle button{border:0;background:transparent;border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink2)}
.toggle button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(61,41,70,.12)}
.chart-cap{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px}
.chart-cap .m{font-size:13px;color:var(--ink2)}
.chart-cap .v{font-family:"Noto Serif TC",serif;font-weight:700;font-size:20px}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}

/* ---------- people mini ---------- */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #EFE6F3}
.rank li:last-child{border-bottom:0}
.rank .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--lav2);color:var(--lavd);flex:none}
.rank li:first-child .n{background:linear-gradient(135deg,#E9D3A5,#C29A5A);color:#fff}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{display:block;font-size:12px;color:var(--ink3)}
.rank .amt{font-family:"Noto Serif TC",serif;font-weight:700;white-space:nowrap}

.empty{text-align:center;padding:26px 16px;color:var(--ink2);font-size:14px;background:rgba(255,255,255,.55);border:1px dashed var(--lav);border-radius:18px}
.empty .btn{margin-top:12px}

/* ---------- add form ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--lav2);border-radius:14px;padding:4px;margin:4px 0 18px}
.seg button{border:0;background:transparent;border-radius:11px;padding:10px 4px;font-size:14.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 6px rgba(61,41,70,.1)}
.form-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 16px 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lines{margin:0 0 6px}
.line{border:1px solid #EADFEF;border-radius:14px;padding:10px;margin-bottom:10px;background:#fff}
.line + .line{margin-top:0}
.line-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1px solid #E2D6E8;border-radius:12px;overflow:hidden;background:#fff}
.qty button{width:36px;height:40px;border:0;background:var(--lav2);font-size:18px;color:var(--lavd)}
.qty input{width:46px;height:40px;border:0;text-align:center;font-size:16px;outline:none;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mini{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);flex:1;min-width:120px}
.mini input{flex:1;min-width:0;height:40px;padding:0 10px;font-size:16px;border:1px solid #E2D6E8;border-radius:12px;outline:none;background:#fff}
.line-cost{font-size:12.5px;color:var(--gold);white-space:nowrap}
.line-del{margin-left:auto;border:0;background:transparent;color:var(--ink3);font-size:13px;padding:6px 4px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.mode button{border:1px solid #E2D6E8;background:#fff;border-radius:12px;padding:9px 6px;font-size:14px;color:var(--ink2)}
.mode button[aria-pressed="true"]{border-color:var(--lavd);color:var(--lavd);font-weight:700;background:#FBF8FD}
.add-line{width:100%;border:1px dashed var(--lav);background:transparent;border-radius:14px;padding:11px;color:var(--lavd);font-size:14.5px;margin-bottom:16px}
.gen-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gen-pick button{border:1px solid #E2D6E8;background:#fff;border-radius:14px;padding:12px 8px;text-align:center}
.gen-pick button b{display:block;font-family:"Noto Serif TC",serif;font-size:16px}
.gen-pick button span{font-size:13px;color:var(--ink2)}
.gen-pick button[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF8,var(--gold3));box-shadow:inset 0 0 0 1px var(--gold2)}

.summary{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin:16px -4px 0;background:rgba(255,252,253,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--gold2);border-radius:20px;padding:12px 14px;box-shadow:0 10px 26px rgba(61,41,70,.12);z-index:5}
.sum-grid{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px;margin-bottom:10px}
.sum-grid div{font-size:12px;color:var(--ink2)}
.sum-grid b{display:block;font-family:"Noto Serif TC",serif;font-size:16px;color:var(--ink);white-space:nowrap}
.sum-grid .main b{font-size:20px;color:var(--gold)}
.sum-grid .main b.neg{color:var(--neg)}

/* ---------- records ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid #E2D6E8;background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--ink2)}
.chips button[aria-pressed="true"]{border-color:var(--lavd);background:var(--lavd);color:#fff}
.day{margin-bottom:14px}
.day-h{font-size:12.5px;color:var(--ink3);margin:0 0 6px 4px}
.rec{background:var(--paper);border:1px solid #EADFEF;border-radius:16px;margin-bottom:8px;overflow:hidden}
.rec-main{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left}
.tag{flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px}
.tag.retail{background:#F6E6EE;color:#A85C7C}
.tag.order{background:#EEE5F5;color:var(--lavd)}
.tag.bonus{background:var(--gold3);color:var(--gold)}
.rec-mid{flex:1;min-width:0}
.rec-mid b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-mid small{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-amt{text-align:right;white-space:nowrap}
.rec-amt b{display:block;font-family:"Noto Serif TC",serif;font-size:16px}
.rec-amt small{font-size:11.5px;color:var(--ink3)}
.rec-detail{padding:0 14px 14px;border-top:1px dashed #EADFEF}
.rec-detail table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.rec-detail td{padding:4px 0;vertical-align:top}
.rec-detail td:last-child{text-align:right;white-space:nowrap}
.rec-detail .tot td{border-top:1px solid #EFE6F3;padding-top:7px;font-weight:700}
.note{font-size:13px;color:var(--ink2);background:var(--lav2);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.neg{color:var(--neg)}

/* ---------- people ---------- */
.search{position:relative;margin-bottom:12px}
.person{background:var(--paper);border:1px solid #EADFEF;border-radius:16px;margin-bottom:8px;overflow:hidden}
.person-main{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:"Noto Serif TC",serif;font-weight:700;background:linear-gradient(135deg,#F1E6F8,#E3D2EF);color:var(--lavd)}
.person-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px 14px;border-top:1px dashed #EADFEF;font-size:12px;color:var(--ink2)}
.person-stats b{display:block;font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink)}
.hist{list-style:none;margin:0;padding:0 14px 12px}
.hist li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid #F3ECF6}
.hist li span:first-child{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- settings ---------- */
.set-block{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 16px 4px;margin-bottom:14px}
.set-block h4{font-family:"Noto Serif TC",serif;font-size:16px;margin:0 0 12px}
.set-actions{display:grid;gap:10px;padding-bottom:14px}
.cost-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:14px}
.cost-table th{font-weight:500;color:var(--ink2);text-align:right;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cost-table th:first-child,.cost-table td:first-child{text-align:left}
.cost-table th+th,.cost-table td+td{padding-left:10px;width:17%}
.cost-table td{padding:6px 0;text-align:right;border-bottom:1px solid #F3ECF6}
.cost-table tr.cat td{font-family:"Noto Serif TC",serif;font-weight:700;color:var(--gold);padding-top:14px;border-bottom:0}
.cost-table td.me{font-weight:700}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,252,253,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--ink3)}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--lavd);font-weight:700}
.nav .plus span.pl{width:44px;height:44px;margin-top:-18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#C9A468,#A7803F);box-shadow:0 6px 16px rgba(167,128,63,.35);color:#fff}
.nav .plus span.pl svg{stroke:#fff;stroke-width:2.2}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:88vw;text-align:center;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--ink3);margin:28px 0 0;letter-spacing:.06em}
</style>
</head>
<body>

<div id="welcome" class="welcome hidden">
  <img class="logo" id="w-logo" alt="仙女皇家 一級獲利">
  <p class="tagline serif">記錄每一筆努力　看見自己的豐盛</p>
  <p class="opening serif">
    <span>算清楚自己的每一分利潤，</span>
    <span>才知道目標要往哪裡去。</span>
    <span>女生會賺錢，才有底氣。</span>
  </p>
  <div class="w-form">
    <div class="field">
      <label for="w-name">你的暱稱</label>
      <input id="w-name" class="input" maxlength="16" placeholder="例如：Megan" autocomplete="nickname">
    </div>
    <div class="field">
      <span class="f-label">你的級別</span>
      <div class="level-pick" id="w-level">
        <button type="button" data-level="L1" aria-pressed="false">一級</button>
        <button type="button" data-level="ROYAL" aria-pressed="true">皇家</button>
      </div>
      <div class="hint">成本價會依級別自動帶入，之後可以在設定裡更改。</div>
    </div>
    <div class="field">
      <label for="w-goal">每月獲利目標（可以之後再填）</label>
      <input id="w-goal" class="input" inputmode="numeric" placeholder="例如：50000">
    </div>
    <button class="btn" id="w-start" type="button">開始記錄</button>
    <p class="privacy">資料只存在你自己的手機裡，別人看不到。</p>
  </div>
  <p class="credit">仙女團隊專屬資源｜巧穎開發</p>
</div>

<div id="main" class="hidden">
  <div class="app" id="view"></div>
  <nav class="nav" aria-label="主選單">

/* ================= 儲存 ================= */
const LS_KEY = 'fairyRoyalProfit.v1';
let memFallback = null;
function defaultState(){
  return { ver:1, profile:{ name:'', level:'ROYAL', goal:0, rate1:8, rate2:2 }, records:[] };
}
function loadState(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){}
  return memFallback ? normalize(memFallback) : defaultState();
}
function normalize(s){
  const d = defaultState();
  if(!s || typeof s !== 'object') return d;
  d.profile = Object.assign(d.profile, s.profile || {});
  d.records = Array.isArray(s.records) ? s.records : [];
  return d;
}
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ memFallback = JSON.parse(JSON.stringify(state)); }
}
let state = loadState();

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[,，\s]/g,'')); return isFinite(n) ? n : 0; };
const round1 = n => Math.round(n * 10) / 10;
const money = n => (n < 0 ? '−' : '') + 'NT$' + Math.abs(round1(n)).toLocaleString('zh-TW', { maximumFractionDigits:1 });
const plain = n => round1(n).toLocaleString('zh-TW', { maximumFractionDigits:1 });
const pad2 = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const thisMonth = () => todayStr().slice(0,7);
const shiftMonth = (ym, k) => { let [y,m] = ym.split('-').map(Number); m += k; while(m < 1){ m += 12; y--; } while(m > 12){ m -= 12; y++; } return `${y}-${pad2(m)}`; };
const ymLabel = ym => { const [y,m] = ym.split('-'); return `${y}年${Number(m)}月`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const costOf = (pid, level) => { const p = PMAP[pid]; return p ? p[level] : null; };
const WEEK = ['日','一','二','三','四','五','六'];

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');

}

/* ================= 計算 ================= */
function draftTotals(d){
  const lv = state.profile.level;
  if(d.type === 'bonus'){
    const rate = d.gen === 2 ? num(state.profile.rate2) : num(state.profile.rate1);
    const p = num(d.base) * rate / 100;
    return { revenue:p, cost:0, profit:p, rate };
  }
  let revenue = 0, cost = 0;
  if(d.mode === 'quick'){
    cost = num(d.quickCost) + num(d.extra);
    revenue = d.type === 'retail' ? num(d.quickRevenue) : num(d.received);
    return { revenue, cost, profit: revenue - cost };
  }
  d.lines.forEach(l => {
    if(!l.pid) return;
    const q = num(l.qty);
    const c = l.pid === 'custom' ? num(l.customCost) : (costOf(l.pid, lv) ?? 0);
    cost += q * c;
    if(d.type === 'retail') revenue += q * num(l.price);
  });
  cost += num(d.extra);
  if(d.type === 'order') revenue = num(d.received);
  return { revenue, cost, profit: revenue - cost };
}
function recsInMonth(ym){ return state.records.filter(r => (r.date || '').startsWith(ym)); }
function agg(list){
  const a = { revenue:0, cost:0, profit:0, retail:0, order:0, bonus:0, count:list.length };
  list.forEach(r => { a.revenue += r.revenue; a.cost += r.cost; a.profit += r.profit; a[r.type] += r.profit; });
  return a;
}

function chart(){
  const months = []; for(let i = 11; i >= 0; i--) months.push(shiftMonth(ui.month, -i));
  const vals = months.map(ym => { const a = agg(recsInMonth(ym)); return ui.chartMode === 'profit' ? a.profit : a.revenue; });
  const W = 340, H = 180, L = 10, Rr = 10, T = 18, B = 26;
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const xs = i => L + i * (W - L - Rr) / 11;
  const ys = v => T + (1 - (v - min) / span) * (H - T - B);
  const pts = vals.map((v,i) => [xs(i), ys(v)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C${c1x},${Math.min(Math.max(c1y,T-6),H-B+6)} ${c2x},${Math.min(Math.max(c2y,T-6),H-B+6)} ${p2[0]},${p2[1]}`;
  }
  const zeroY = ys(0);
  const area = `${d} L${pts[11][0]},${zeroY} L${pts[0][0]},${zeroY} Z`;
  const sel = Math.min(Math.max(ui.chartIdx, 0), 11);
  const colW = (W - L - Rr) / 11;
  const hits = months.map((ym,i) => `<rect x="${xs(i)-colW/2}" y="0" width="${colW}" height="${H}" fill="transparent" data-action="chartPick" data-i="${i}" style="cursor:pointer"><title>${ymLabel(ym)}</title></rect>`).join('');
  const labels = months.map((ym,i) => `<text x="${xs(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="${i===sel?'#3D2946':'#A897AE'}" font-weight="${i===sel?700:400}">${Number(ym.slice(5))}月</text>`).join('');
  const dots = pts.map((p,i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i===sel?5:2.6}" fill="${i===sel?'#fff':'#B98F4E'}" stroke="#B98F4E" stroke-width="${i===sel?2.4:0}"/>`).join('');
  const hasData = vals.some(v => v !== 0);
  return `
    <div class="chart-cap"><span class="m">${ymLabel(months[sel])}${ui.chartMode==='profit'?'獲利':'營業額'}</span><span class="v ${vals[sel]<0?'neg':''}">${money(vals[sel])}</span></div>
    <div class="chart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近12個月${ui.chartMode==='profit'?'獲利':'營業額'}曲線">
        <defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B99AD6" stop-opacity=".38"/><stop offset="1" stop-color="#B99AD6" stop-opacity="0"/></linearGradient></defs>
        <line x1="${L}" x2="${W-Rr}" y1="${zeroY}" y2="${zeroY}" stroke="#E3CFA6" stroke-dasharray="3 4"/>
        <line x1="${pts[sel][0]}" x2="${pts[sel][0]}" y1="${T-8}" y2="${H-B}" stroke="#E3CFA6"/>
        ${hasData ? `<path d="${area}" fill="url(#gArea)"/><path d="${d}" fill="none" stroke="#9A78BD" stroke-width="2.4" stroke-linecap="round"/>` : ''}
        ${dots}${labels}${hits}
      </svg>
    </div>
    ${hasData ? '' : '<p class="hint" style="text-align:center;margin:4px 0 2px">開始記帳後，這裡會長出你的曲線。點每個月份可以看金額。</p>'}
  `;
}

  return `<div class="sum-grid">
      <div>${labels[0]}<b>${money(a)}</b></div>
      <div>${labels[1]}<b>${b}</b></div>
      <div class="main">${labels[2]}<b class="${t.profit<0?'neg':''}">${money(t.profit)}</b></div>
    </div>
    <button type="button" class="btn btn-gold" data-action="save">儲存這一筆</button>`;
}
function refreshLines(){ const el = $('#lines'); if(el) el.innerHTML = linesHtml(); }
function refreshSummary(){ const el = $('#summary'); if(el) el.innerHTML = summaryHtml(); }

function saveDraft(){
  const d = ui.draft, lv = state.profile.level;
  const person = d.person.trim();
  if(!person) return toast(d.type === 'retail' ? '請填寫賣給誰' : d.type === 'order' ? '請填寫叫貨人' : '請填寫下線皇家的名字');
  const t = draftTotals(d);
  const rec = { id:uid(), type:d.type, person, note:d.note.trim(), level:lv, createdAt:Date.now() };
  if(d.type === 'bonus'){
    if(!d.month) return toast('請選擇獎金月份');
    if(num(d.base) <= 0) return toast('請填寫叫貨金額');
    Object.assign(rec, { date:d.month + '-01', gen:d.gen, rate:t.rate, base:num(d.base), items:[], extra:0, revenue:t.profit, cost:0, profit:t.profit });
  } else {
    if(!d.date) return toast('請選擇日期');
    const items = [];
    if(d.mode === 'quick'){
      if(d.type === 'retail' && num(d.quickRevenue) <= 0) return toast('請填寫售出金額');
      if(d.type === 'order' && num(d.received) <= 0) return toast('請填寫賣給下線的金額');
      if(String(d.quickCost).trim() === '') return toast('請填寫你的成本');
      items.push({ name: d.quickDesc.trim() || '直接填金額', qty:1, cost:num(d.quickCost), price: d.type === 'retail' ? num(d.quickRevenue) : null });
      rec.quick = true;
    }
    if(d.mode !== 'quick') for(const l of d.lines){
      if(!l.pid) continue;
      const q = num(l.qty);
      if(q <= 0) return toast('數量要大於 0');
      if(l.pid === 'custom' && !l.customName.trim()) return toast('請填寫自訂品項名稱');
      const cost = l.pid === 'custom' ? num(l.customCost) : costOf(l.pid, lv);
      if(d.type === 'retail' && num(l.price) <= 0) return toast('請填寫售價');
      items.push({ name: l.pid === 'custom' ? l.customName.trim() : PMAP[l.pid].name, qty:q, cost, price: d.type === 'retail' ? num(l.price) : null });
    }
    if(!items.length) return toast('請至少選一個品項');
    if(d.type === 'order' && num(d.received) <= 0) return toast('請填寫下線付你的金額');
    Object.assign(rec, { date:d.date, downLevel:d.downLevel, items, extra:num(d.extra), revenue:t.revenue, cost:t.cost, profit:t.profit });
  }
  state.records.push(rec); persist();
  const label = d.type === 'order' ? '利潤差' : d.type === 'bonus' ? '獎金' : '獲利';
  toast(`已儲存，這筆${label} ${money(rec.profit)}`);
  const keepType = d.type, keepDate = d.date, keepMonth = d.month, keepMode = d.mode;
  ui.draft = newDraft(keepType); ui.draft.date = keepDate; ui.draft.month = keepMonth; ui.draft.mode = keepMode;
  render(); window.scrollTo({ top:0 });
}

/* ================= 畫面：明細 ================= */
function viewList(){
  let list = recsInMonth(ui.month);
  const m = agg(list);
  if(ui.listFilter !== 'all') list = list.filter(r => r.type === ui.listFilter);
  list.sort((a,b) => b.date.localeCompare(a.date) || (b.createdAt||0) - (a.createdAt||0));
  const groups = {};
  list.forEach(r => (groups[r.date] = groups[r.date] || []).push(r));
  const isRoyal = state.profile.level === 'ROYAL';
  const chips = [['all','全部'],['retail','零售'],['order','叫貨']].concat(isRoyal || m.bonus ? [['bonus','獎金']] : []);
  return `
    <h2 class="page-title">明細</h2>
    ${monthSwitch()}
    <p class="page-desc" style="text-align:center;margin-top:4px">這個月 ${m.count} 筆，獲利 <b class="${m.profit<0?'neg':''}">${money(m.profit)}</b></p>
    <div class="chips" role="group" aria-label="篩選">${chips.map(([k,n]) => `<button type="button" data-action="filter" data-v="${k}" aria-pressed="${ui.listFilter===k}">${n}</button>`).join('')}</div>
    ${list.length ? Object.keys(groups).map(date => {
      const dt = new Date(date + 'T00:00:00');
      const head = groups[date][0].type === 'bonus' && groups[date].every(r => r.type === 'bonus') ? `${ymLabel(date.slice(0,7))} 獎金` : `${Number(date.slice(5,7))}月${Number(date.slice(8))}日 星期${WEEK[dt.getDay()]}`;
      return `<div class="day"><div class="day-h">${head}</div>${groups[date].map(recHtml).join('')}</div>`;
    }).join('') : `<div class="empty">這個月還沒有${ui.listFilter==='all'?'':TYPE_NAME[ui.listFilter]}紀錄。<button class="btn btn-sm" data-nav="add">記一筆</button></div>`}
  `;
}
const itemText = (r, i) => r.quick ? i.name : `${i.name}×${i.qty}`;
function recHtml(r){
  const open = ui.listOpen === r.id;
  const sub = r.type === 'bonus' ? `第${r.gen===2?'二':'一'}代，叫貨 ${money(r.base)} × ${r.rate}%`
            : r.items.map(i => itemText(r, i)).join('、');
  let detail = '';
  if(open){
    if(r.type === 'bonus'){
      detail = `<table>
        <tr><td>下線皇家</td><td>${esc(r.person)}</td></tr>
        <tr><td>代數</td><td>第${r.gen===2?'二':'一'}代（${r.rate}%）</td></tr>
        <tr><td>當月叫貨金額</td><td>${money(r.base)}</td></tr>
        <tr class="tot"><td>組織獎金</td><td>${money(r.profit)}</td></tr></table>`;
    } else {
      detail = `<table>
        ${r.type==='order' && r.downLevel ? `<tr><td>下線級別</td><td>${esc(r.downLevel)}</td></tr>` : ''}
        ${r.quick ? `<tr><td>品項</td><td>${esc(r.items[0].name)}</td></tr><tr><td>我填的成本</td><td>${money(r.items[0].cost)}</td></tr>` : r.items.map(i => `<tr><td>${esc(i.name)} × ${i.qty}<br><small style="color:var(--ink3)">${r.type==='retail' ? `售價 ${money(i.price)}，` : ''}成本 ${money(i.cost)}</small></td><td>${r.type==='retail' ? money(i.price*i.qty) : money(i.cost*i.qty)}</td></tr>`).join('')}
        ${r.extra ? `<tr><td>其他成本</td><td>${money(r.extra)}</td></tr>` : ''}
        <tr><td>${r.type==='retail'?'營業額':'下線付款'}</td><td>${money(r.revenue)}</td></tr>
        <tr><td>${r.quick ? '總成本' : `總成本（${LEVEL_NAME[r.level]||''}成本）`}</td><td>${money(r.cost)}</td></tr>
        <tr class="tot"><td>${r.type==='retail'?'獲利':'利潤差'}</td><td class="${r.profit<0?'neg':''}">${money(r.profit)}</td></tr></table>`;
    }
    detail = `<div class="rec-detail">${detail}${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}
      <button type="button" class="btn btn-danger btn-sm ${ui.armed===r.id?'armed':''}" data-action="delRec" data-id="${r.id}">${ui.armed===r.id ? '再按一次確認刪除' : '刪除這筆'}</button></div>`;
  }
  return `<div class="rec">
    <button type="button" class="rec-main" data-action="openRec" data-id="${r.id}" aria-expanded="${open}">
      <span class="tag ${r.type}">${TYPE_NAME[r.type]}</span>
      <span class="rec-mid"><b>${esc(r.person)}</b><small>${esc(sub)}</small></span>
      <span class="rec-amt"><b class="${r.profit<0?'neg':''}">${money(r.profit)}</b><small>${r.type==='bonus'?'獎金':r.type==='order'?'利潤差':'獲利'}</small></span>
    </button>${detail}</div>`;
}

/* ================= 畫面：名單 ================= */
function peopleAgg(mode, records){
  const map = {};
  records.forEach(r => {
    const isCust = r.type === 'retail';
    if((mode === 'customer') !== isCust) return;
    const k = r.person;
    const p = map[k] = map[k] || { name:k, revenue:0, profit:0, count:0, last:'', recs:[] };
    p.revenue += r.type === 'bonus' ? r.base : r.revenue;
    p.profit += r.profit; p.count++; p.recs.push(r);
    if(r.date > p.last) p.last = r.date;
  });
  return Object.values(map).sort((a,b) => b.revenue - a.revenue);
}
function viewPeople(){
  const mode = ui.peopleMode;
  let list = peopleAgg(mode, state.records);
  const q = ui.search.trim().toLowerCase();
  if(q) list = list.filter(p => p.name.toLowerCase().includes(q));
  return `
    <h2 class="page-title">名單</h2>
    <p class="page-desc">${mode==='customer' ? '每位客人買了多少、幫你賺了多少，一目了然。' : '每位下線叫了多少、帶給你多少利潤差和獎金。'}</p>
    <div class="seg" role="group" aria-label="名單類型">
      <button type="button" data-action="peopleMode" data-v="customer" aria-pressed="${mode==='customer'}">客人</button>
      <button type="button" data-action="peopleMode" data-v="downline" aria-pressed="${mode==='downline'}">下線</button>
    </div>
    <div class="search"><input class="input" id="people-search" placeholder="搜尋名字" value="${esc(ui.search)}" aria-label="搜尋名字"></div>
    <div id="people-list">${peopleListHtml(list, mode)}</div>
  `;
}
function peopleListHtml(list, mode){
  if(!list.length) return `<div class="empty">${ui.search ? '找不到這個名字。' : mode==='customer' ? '還沒有客人紀錄，記下第一筆零售吧。' : '還沒有下線叫貨或獎金紀錄。'}</div>`;
  return list.map(p => {
    const open = ui.peopleOpen === mode + ':' + p.name;
    const recs = p.recs.slice().sort((a,b) => b.date.localeCompare(a.date)).slice(0, 12);
    return `<div class="person">
      <button type="button" class="person-main" data-action="openPerson" data-k="${esc(mode + ':' + p.name)}" aria-expanded="${open}">
        <span class="avatar">${esc([...p.name][0] || '？')}</span>
        <span class="rec-mid"><b>${esc(p.name)}</b><small>最近一次 ${Number(p.last.slice(5,7))}月${p.recs.some(r => r.type!=='bonus' && r.date===p.last) ? Number(p.last.slice(8))+'日' : ''}</small></span>
        <span class="rec-amt"><b>${money(p.revenue)}</b><small>${mode==='customer'?'累積購買':'累積叫貨'}</small></span>
      </button>
      ${open ? `
        <div class="person-stats">
          <div>次數<b>${p.count}</b></div>
          <div>${mode==='customer'?'幫你賺':'帶給你'}<b class="${p.profit<0?'neg':''}">${money(p.profit)}</b></div>
          <div>平均每次<b>${money(p.revenue / p.count)}</b></div>
        </div>
        <ul class="hist">${recs.map(r => `<li><span>${r.type==='bonus' ? `${ymLabel(r.date.slice(0,7))} 第${r.gen===2?'二':'一'}代獎金` : `${r.date.slice(5).replace('-','/')} ${esc(r.items.map(i => itemText(r, i)).join('、'))}`}</span><span>${money(r.profit)}</span></li>`).join('')}</ul>` : ''}
    </div>`;
  }).join('');
}

/* ================= 畫面：設定 ================= */
function viewSettings(){
  const p = state.profile;
  const lv = p.level;
  return `
    <h2 class="page-title">設定</h2>
    <div class="set-block">
      <h4>我的資料</h4>
      <div class="field"><label for="s-name">暱稱</label><input id="s-name" class="input" data-s="name" maxlength="16" value="${esc(p.name)}"></div>
      <div class="field"><span class="f-label">級別</span>
        <div class="level-pick">
          <button type="button" data-action="setLevel" data-v="L1" aria-pressed="${lv==='L1'}">一級</button>
          <button type="button" data-action="setLevel" data-v="ROYAL" aria-pressed="${lv==='ROYAL'}">皇家</button>
        </div>
        <div class="hint">更改級別後，新紀錄會用新的成本價；以前的紀錄不會變。</div>
      </div>
      <div class="field"><label for="s-goal">每月獲利目標</label><input id="s-goal" class="input" data-s="goal" inputmode="numeric" placeholder="例如：50000" value="${p.goal ? esc(p.goal) : ''}"></div>
    </div>

    ${lv === 'ROYAL' ? `
    <div class="set-block">
      <h4>組織獎金比例</h4>
      <div class="row2">
        <div class="field"><label for="s-r1">第一代（%）</label><input id="s-r1" class="input" data-s="rate1" inputmode="decimal" value="${esc(p.rate1)}"></div>
        <div class="field"><label for="s-r2">第二代（%）</label><input id="s-r2" class="input" data-s="rate2" inputmode="decimal" value="${esc(p.rate2)}"></div>
      </div>
    </div>` : ''}

    <div class="set-block">
      <h4>我的成本價（${LEVEL_NAME[lv]}）</h4>
      <table class="cost-table">
        <thead><tr><th>品項</th><th>售價</th><th>成本</th><th>利潤</th></tr></thead>
        <tbody>${CATS.map(c => {
          const items = PRODUCTS.filter(x => x.cat === c.key && x[lv] != null);
          if(!items.length) return '';
          return `<tr class="cat"><td colspan="4">${c.name}</td></tr>` + items.map(x => `<tr><td>${esc(x.name)}</td><td>${x.retail!=null?plain(x.retail):'－'}</td><td class="me">${plain(x[lv])}</td><td>${x.retail!=null?plain(x.retail-x[lv]):'－'}</td></tr>`).join('');
        }).join('')}</tbody>
      </table>
    </div>

    <div class="set-block">
      <h4>資料備份</h4>
      <p class="page-desc">資料存在這支手機的瀏覽器裡。換手機或清除瀏覽器前，記得先下載備份。</p>
      <div class="set-actions">
        <button type="button" class="btn btn-ghost" data-action="export">下載備份檔</button>
        <button type="button" class="btn btn-ghost" data-action="import">匯入備份檔</button>
        <button type="button" class="btn btn-danger ${ui.armed==='clear'?'armed':''}" data-action="clear">${ui.armed==='clear' ? '再按一次，清除全部紀錄' : '清除全部紀錄'}</button>
      </div>
    </div>
    <p class="foot">仙女團隊專屬資源｜巧穎開發</p>
  `;
}

/* ================= 主渲染 ================= */
function render(){
  if(!state.profile.name){
    $('#welcome').classList.remove('hidden'); $('#main').classList.add('hidden'); return;
  }
  $('#welcome').classList.add('hidden'); $('#main').classList.remove('hidden');
  const views = { home:viewHome, add:viewAdd, list:viewList, people:viewPeople, settings:viewSettings };
  $('#view').innerHTML = (views[ui.view] || viewHome)();
  document.querySelectorAll('.nav [data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === ui.view ? 'page' : 'false'));
}
function go(view){ ui.view = view; ui.armed = null; render(); window.scrollTo({ top:0 }); }

/* ================= 事件 ================= */
// welcome
let wLevel = 'ROYAL';
$('#w-level').addEventListener('click', e => {
  const b = e.target.closest('[data-level]'); if(!b) return;
  wLevel = b.dataset.level;
  $('#w-level').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
$('#w-start').addEventListener('click', () => {
  const name = $('#w-name').value.trim();
  if(!name) return toast('請先填寫暱稱');
  state.profile.name = name; state.profile.level = wLevel; state.profile.goal = num($('#w-goal').value);
  persist(); ui.view = 'home'; render();
});

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if(nav){ e.preventDefault(); if(nav.dataset.nav === 'add' && ui.view !== 'add') ui.draft = newDraft(ui.draft.type); go(nav.dataset.nav); return; }
  const a = e.target.closest('[data-action]'); if(!a) return;
  const act = a.dataset.action, d = ui.draft;
  switch(act){
    case 'month': ui.month = shiftMonth(ui.month, Number(a.dataset.d)); ui.chartIdx = 11; ui.listOpen = null; render(); break;
    case 'chartMode': ui.chartMode = a.dataset.v; render(); break;
    case 'chartPick': ui.chartIdx = Number(a.dataset.i); { const box = document.querySelector('.chart-box'); if(box) box.innerHTML = chart(); } break;
    case 'type': d.type = a.dataset.v; d.person = ''; d.lines = [blankLine()]; d.received = ''; d.quickRevenue = ''; d.quickCost = ''; d.quickDesc = ''; render(); break;
    case 'addLine': d.lines.push(blankLine()); refreshLines(); refreshSummary(); break;
    case 'delLine': d.lines.splice(Number(a.dataset.i), 1); refreshLines(); refreshSummary(); break;
    case 'qty': { const l = d.lines[Number(a.dataset.i)]; l.qty = Math.max(0, num(l.qty) + Number(a.dataset.d)); refreshLines(); refreshSummary(); break; }
    case 'gen': d.gen = Number(a.dataset.v); render(); break;
    case 'mode': d.mode = a.dataset.v; render(); break;
    case 'save': saveDraft(); break;
    case 'filter': ui.listFilter = a.dataset.v; render(); break;
    case 'openRec': ui.listOpen = ui.listOpen === a.dataset.id ? null : a.dataset.id; ui.armed = null; render(); break;
    case 'delRec':
      if(ui.armed === a.dataset.id){
        state.records = state.records.filter(r => r.id !== a.dataset.id); persist();
        ui.armed = null; ui.listOpen = null; toast('已刪除這筆紀錄'); render();
      } else { ui.armed = a.dataset.id; render(); }
      break;
    case 'peopleMode': ui.peopleMode = a.dataset.v; ui.peopleOpen = null; ui.search = ''; render(); break;
    case 'openPerson': ui.peopleOpen = ui.peopleOpen === a.dataset.k ? null : a.dataset.k; renderPeopleList(); break;
    case 'setLevel':
      if(state.profile.level !== a.dataset.v){
        state.profile.level = a.dataset.v; persist();
        ui.draft = newDraft(); toast(`已改成${LEVEL_NAME[a.dataset.v]}成本`); render();
      }
      break;
    case 'export': exportData(); break;
    case 'import': $('#import-file').click(); break;
    case 'clear':
      if(ui.armed === 'clear'){
        state.records = []; persist(); ui.armed = null; toast('已清除全部紀錄'); render();
      } else { ui.armed = 'clear'; render(); }
      break;
  }
});

document.addEventListener('input', e => {
  const t = e.target, d = ui.draft;
  if(t.dataset.f){
    d[t.dataset.f] = t.value;
    refreshSummary();
  } else if(t.dataset.lf && t.dataset.lf !== 'pid'){
    const l = d.lines[Number(t.dataset.line)]; l[t.dataset.lf] = t.value;
    if(t.dataset.lf === 'qty'){
      const row = t.closest('.line').querySelector('.line-cost');
      const c = l.pid && l.pid !== 'custom' ? costOf(l.pid, state.profile.level) : null;
      if(row && c != null) row.textContent = `成本 ${money(c)} × ${num(l.qty)} ＝ ${money(c * num(l.qty))}`;
    }
    refreshSummary();
  } else if(t.dataset.s){
    const k = t.dataset.s;
    state.profile[k] = k === 'name' ? t.value.trim() : num(t.value);
    if(k === 'name' && !state.profile.name) return;
    persist();
  } else if(t.id === 'people-search'){
    ui.search = t.value; renderPeopleList();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.lf === 'pid'){
    const l = ui.draft.lines[Number(t.dataset.line)];
    l.pid = t.value;
    const p = PMAP[t.value];
    l.price = p && p.retail != null ? p.retail : '';
    if(t.value !== 'custom'){ l.customName = ''; l.customCost = ''; }
    refreshLines(); refreshSummary();
  } else if(t.dataset.s){
    if(t.dataset.s === 'name' && !state.profile.name){ state.profile.name = '仙女'; persist(); }
    toast('已儲存設定');
  } else if(t.dataset.f === 'downLevel'){
    ui.draft.downLevel = t.value;
  }
});
function renderPeopleList(){
  const el = $('#people-list'); if(!el) return;
  let list = peopleAgg(ui.peopleMode, state.records);
  const q = ui.search.trim().toLowerCase();
  if(q) list = list.filter(p => p.name.toLowerCase().includes(q));
  el.innerHTML = peopleListHtml(list, ui.peopleMode);
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `皇家一級獲利備份-${todayStr().replace(/-/g,'')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('備份檔已下載');
}
$('#import-file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.records) || !data.profile) throw new Error('bad');
      const incoming = normalize(data);
      const ids = new Set(state.records.map(r => r.id));
      const added = incoming.records.filter(r => !ids.has(r.id));
      state.records = state.records.concat(added);
      if(!state.profile.name) state.profile = incoming.profile;
      persist(); render();
      toast(`匯入完成，新增 ${added.length} 筆紀錄`);
    }catch(err){ toast('這個檔案不是獲利手帳的備份檔'); }
    e.target.value = '';
  };
  reader.readAsText(f);
});

render();
</script>
</body>
</html>
