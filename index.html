<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:#3D2946;min-height:100vh;
  background:#F6F0F9 radial-gradient(130% 55% at 50% -8%,#FFFFFF 0%,#F4EBF9 50%,rgba(246,240,249,0) 100%) no-repeat;-webkit-font-smoothing:antialiased}
.wrap{max-width:400px;margin:0 auto;padding:44px 24px 40px;text-align:center}
.logo{width:min(230px,60vw);height:auto;display:block;margin:0 auto 16px;filter:drop-shadow(0 14px 30px rgba(138,105,171,.22))}
.tag{font-family:"Noto Serif TC","Songti TC",serif;font-size:15px;letter-spacing:.18em;color:#AE874A;margin:0 0 28px}
.box{background:#FFFCFD;border:1px solid rgba(174,135,74,.28);border-radius:22px;padding:22px 20px;text-align:left}
label{display:block;font-size:13px;color:#7B6684;margin:0 0 8px;font-weight:500}
input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid #E2D6E8;background:#fff;outline:none;color:inherit;letter-spacing:.06em}
input:focus{border-color:#8A69AB;box-shadow:0 0 0 3px rgba(138,105,171,.14)}
button{display:block;width:100%;margin-top:14px;border:0;border-radius:999px;padding:14px;font:inherit;font-size:16px;font-weight:700;letter-spacing:.1em;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#9C7BBC,#7E5E9F);box-shadow:0 8px 20px rgba(126,94,159,.28)}
button:disabled{opacity:.6}
:focus-visible{outline:2px solid #8A69AB;outline-offset:2px}
.msg{min-height:22px;font-size:13.5px;color:#B0506A;margin:10px 0 0;text-align:center}
.msg.ok{color:#7B6684}
.note{font-size:12.5px;color:#A897AE;margin:14px 0 0;text-align:center}
.credit{font-size:12px;color:#A897AE;margin:26px 0 0;letter-spacing:.06em}
</style>

const KEY_STORE = 'fairyRoyalUnlock.v1';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const gate = document.getElementById('gate'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');

async function tryKey(rawKey){
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:u8(ENC.iv) }, key, u8(ENC.data));
  return new TextDecoder().decode(plain);
}
function openApp(html){
  const run = () => setTimeout(() => { document.open(); document.write(html); document.close(); }, 0);
  if(document.readyState === 'complete') run(); else window.addEventListener('load', run, { once:true });
}
function remember(raw){ try{ localStorage.setItem(KEY_STORE, b64(raw)); }catch(e){} }

async function unlock(){
  const pass = pw.value;
  if(!pass){ msg.textContent = '請輸入密碼'; return; }
  go.disabled = true; msg.className = 'msg ok'; msg.textContent = '解鎖中…';
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    const raw = await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:u8(ENC.salt), iterations:ENC.iter }, base, 256);
    const html = await tryKey(raw);
    remember(raw); openApp(html);
  }catch(e){
    go.disabled = false; msg.className = 'msg'; msg.textContent = '密碼不正確，請再確認一次';
    pw.select();
  }
}

(async () => {
  if(!window.crypto || !crypto.subtle){
    gate.hidden = false; msg.textContent = '這個瀏覽器無法解鎖，請用 Safari 或 Chrome 打開網址'; go.disabled = true; return;
  }
  let saved = null;
  try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
  if(saved){
    try{ const html = await tryKey(u8(saved)); openApp(html); return; }
    catch(e){ try{ localStorage.removeItem(KEY_STORE); }catch(_){} }
  }
  gate.hidden = false;
  go.addEventListener('click', unlock);
  pw.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
  pw.focus();
})();
})();
</script>
